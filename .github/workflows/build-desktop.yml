name: build-desktop

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare desktop web assets
        shell: pwsh
        run: python tools/build_desktop_web.py
      - name: Publish desktop exe
        shell: pwsh
        run: |
          dotnet --info
          dotnet publish desktop/TikuDesktop.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -o out
          Copy-Item out/TikuDesktop.exe out/Tiku-Desktop-1.0.0.exe
      - name: Upload to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.0.0 out/Tiku-Desktop-1.0.0.exe --clobber